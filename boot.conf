# What mkxnuimg.py and xl need to know about this phone (DEVICE=poco-x3-pro). KEY=VALUE, # starts a comment.
# UEFI_TARGET: Mu-Silicium's platform (Platforms/Xiaomi/vayuPkg), FD_BASE/FD_SIZE: where its UEFI image
# sits (Mu-Silicium Resources/Configs/vayu.toml), PLATFORM: the loader's own name for the phone (xnuloader/loader.c).
UEFI_TARGET=vayu
FD_BASE=0x9FC00000
FD_SIZE=0x300000
PLATFORM=vayu
