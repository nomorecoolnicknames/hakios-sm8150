# devices/vayu/device.conf: what this device repository is. tools/hakios-device.py reads it; docs/porting/repositories.md has
# every word, and the device's page (docs/devices/vayu.md) is made from it, so that the status is said in one place.

device vayu
	title       POCO X3 Pro
	vendor      Xiaomi
	soc         sm8150
	defconfig   vayu_defconfig
	firmware    pull-firmware.sh
	maintainer  nomorecoolnicknames (README.md)
	status      display     works     the panel through UEFI's framebuffer, 1080x2400 (vayu_vsync, vayu_wled)
	status      touch       works     Novatek NT36675 on QUP SPI (GPI DMA), multitouch (vayu_nvt, vayu_qup_spi, touchscreen=1 nvt_qup=1)
	status      buttons     works     power and volume through PM8150 / PM8150L PON and GPIO over SPMI (CONFIG_HAKIOS_BUTTONS)
	status      cpu         works     all 8 Kryo 485 cores up to 2.96 GHz, OSM / EPSS LUT (vayu_cpufreq, cpus=8 bootcpu=7 cpufreq=1)
	status      gpu         works     Adreno 640 hardware-accelerated rendering via Mesa freedreno FD640 (vayu_adreno, gpu=1 vayu_gpu=1 vayu_keep=1)
	status      storage     partial   UFS read through the loader and /private/var R/W work (ufs=2 var_store=1 ufs_write=1); Files.app does not work yet
	status      audio       partial   ADSP PIL + TI TAS2562/TAS2564 speaker and microphone work (vayu_audio); 3.5 mm headphone jack (WCD934x, vayu_jack) is silent
	status      battery     partial   PM8150B over SPMI; does not charge under XNU and drains quickly, fuel gauge unverified
	status      haptic      missing   driver in tree (vayu_haptic), not verified on hardware
	status      camera      partial   main camera (IMX582) still photos and ~7.6 fps video work (vayu_camera); other sensors not verified on hardware
	status      torch       missing   driver in tree (hakios.torch), not verified on hardware
	status      wifi        missing   WCN3990 WLAN DSP crashes at PC=0xb0193960 before FW_READY; WMI/HTT/CE not written (vayu_wifi)
	status      bluetooth   missing   WCN3998 UART HCI: bluetoothd restarts in a loop on Apple vendor commands (TEST23-BT, vayu_bt)
	status      cellular    partial   MPSS PIL + rmtfs + QMI DMS/UIM/NAS: LTE registration works (vayu_cell); mobile data (IPA) hangs the SoC
	status      network     partial   USB networking only (DWC3 CDC-ECM/NCM en0, vayu_usbnet); no Wi-Fi or cellular data
	status      thermal     missing   driver in tree (CONFIG_HAKIOS_THERMAL), not verified on hardware
	status      usb         works     Synopsys DWC3 peripheral mode, loader channel and USB networking
	status      sensors     missing   SLPI SSC and SPI IR blaster drivers in tree (vayu_ssc, vayu_ir), not verified on hardware
	status      nfc         missing   NXP PN553 on I2C (vayu_nfc), not working / not verified on hardware
