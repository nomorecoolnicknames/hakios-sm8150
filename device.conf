# devices/vayu/device.conf: what this device repository is. tools/hakios-device.py reads it; docs/porting/repositories.md has
# every word, and the device's page (docs/devices/vayu.md) is made from it, so that the status is said in one place.

device vayu
	title       POCO X3 Pro
	vendor      Xiaomi
	soc         sm8150
	defconfig   vayu_defconfig
	firmware    pull-firmware.sh
	maintainer  nomorecoolnicknames (README.md)
	status      display     works     the panel through UEFI's framebuffer, 1080x2400 up to 120 Hz (vayu_vsync, vayu_wled)
	status      touch       works     Novatek NT36672C on QUP SPI, multitouch (vayu_nvt, vayu_qup_spi, touchscreen=1)
	status      buttons     works     power and volume through PM8150 / PM8150L PON and GPIO over SPMI (CONFIG_HAKIOS_BUTTONS)
	status      cpu         works     all 8 Kryo 485 cores up to 2.96 GHz, OSM / EPSS LUT (cpus=8 bootcpu=7 cpufreq=1)
	status      gpu         partial   Adreno 640 GMU bring-up in progress; CoreAnimation / UIKit rendered via Mesa at 120 fps
	status      storage     works     UFS 3.1 read through the loader; /private/var kept with ufs=2 var_store=1 ufs_write=1
	status      audio       works     ADSP PIL + Cirrus Logic CS35L41 stereo speakers + WCD9340 + 3.5 mm jack (vayu_audio, vayu_jack)
	status      battery     works     PM8150B QG/SMB5 fuel gauge and charger over SPMI, level and state in IOPMPowerSource
	status      haptic      works     Awinic AW8624 LRA on I2C with RTP waveform playback (vayu_haptic)
	status      camera      works     IMX582 48 MP + S5K3T2 20 MP + IMX355 8 MP + OV02B10 2 MP on CCI + CSID/IFE ISP (vayu_camera)
	status      torch       works     PM8150L SCHG flash and torch LED over SPMI, Control Center button
	status      wifi        works     WCN3990 WLAN DSP PIL + QMI WLFW + WMI/HTT/CE host rings (vayu_wifi)
	status      bluetooth   works     WCN3990 UART HCI + QCA Rome TLV firmware + BLE advertising and scanning (vayu_bt)
	status      cellular    partial   MPSS PIL + rmtfs (modemst1/2, fsg) + QRTR QMI DMS/NAS/UIM/WDS + IPA v4.1 en1 (vayu_cell)
	status      network     works     DWC3 USB CDC-NCM / CDC-ECM Ethernet en0 + Wi-Fi + cellular en1 (vayu_usbnet)
	status      thermal     works     TSENS v2.3 temperature sensors (CONFIG_HAKIOS_THERMAL, thermal=1)
	status      usb         works     Synopsys DWC3 peripheral mode, fastboot channel and CDC-NCM/ECM network
	status      sensors     works     SLPI DSP PIL + QMI SSC accelerometer, gyroscope, ALS and proximity + SPI IR blaster (vayu_ssc, vayu_ir)
