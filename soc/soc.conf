# socs/sm8150/soc.conf: what this SoC repository is: the facts of a Qualcomm SM8150-family chip, whatever phone it is in.
# A phone with this SoC includes configs/sm8150.config from its defconfig. docs/porting/repositories.md has every word.

soc sm8150
	title       Qualcomm SM8150 family ("Snapdragon 855 / 855+", "msmnile")
	vendor      Qualcomm
	cores       8, the biggest is core 7
	gpu         Adreno 640
	maintainer  nomorecoolnicknames (README.md)
